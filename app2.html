<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>تواصل مروري — Traffic Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0E5B4A; --primary-dark:#0A4237; --teal:#17877A; --soft:#E6F1EE;
  --bg:#F4F6F7; --surface:#fff; --border:#E4E9EB; --divider:#EDF1F2;
  --text:#16282C; --text-2:#6B7B80; --muted:#9AA8AC;
  --ok:#1B7F4E; --ok-bg:#E3F4EA;
  --warn:#B5731A; --warn-bg:#FDF0DC;
  --info:#1F6FA8; --info-bg:#E4F0F8;
  --danger:#C5453F; --danger-bg:#FBE9E8;
  --neutral:#6B7B80; --neutral-bg:#EEF1F2;
  --star:#F2B01E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#E9EDEE;color:var(--text);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
.hide{display:none !important}

/* ===== Phone shell ===== */
#shell{
  max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 40px rgba(16,40,36,.08);
}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.pb-nav{padding-bottom:88px}

/* ===== App bar ===== */
.bar{
  position:sticky;top:0;z-index:15;background:var(--bg);
  display:flex;align-items:center;gap:8px;padding:14px 16px 10px;
}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:800;text-align:center}
.bar-btn{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  color:var(--text-2);flex:none;
}
.bar-btn:active{background:var(--soft)}

/* ===== Brand ===== */
.mark{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--teal),var(--primary-dark));color:#fff;flex:none;
}
.mark svg{width:34px;height:34px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.brand h2{margin:0;font-size:20px;font-weight:800;color:var(--primary-dark)}
.brand p{margin:0;font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--teal)}

/* ===== Cards ===== */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;
}
.card+.card{margin-top:10px}
.card.tap:active{border-color:var(--primary)}

/* ===== Forms ===== */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.field label .req{color:var(--danger);margin-inline-end:3px}
.inp{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px;outline:none;transition:border-color .15s;
}
.inp:focus{border-color:var(--primary)}
textarea.inp{resize:vertical;min-height:100px}
.inp-icon{position:relative}
.inp-icon .inp{padding-inline-start:44px}
.inp-icon .ic{
  position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
}
.inp-icon .eye{
  position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);
}

.btn{
  width:100%;background:var(--primary);color:#fff;border-radius:14px;padding:15px;
  font-weight:700;font-size:15px;line-height:1.35;
}
.btn:active{background:var(--primary-dark)}
.btn:disabled{background:var(--border);color:var(--muted)}
.btn .sub{display:block;font-size:11px;font-weight:600;opacity:.85}
.btn-out{
  background:var(--surface);color:var(--danger);border:1px solid #F3C9C7;
}
.btn-ghost{background:var(--surface);color:var(--primary);border:1px solid var(--border)}
.btn-link{color:var(--primary);font-weight:700;font-size:13px;width:auto;padding:8px}

.dashed{
  width:100%;border:1px solid rgba(14,91,74,.35);border-radius:14px;background:var(--surface);
  color:var(--primary);font-weight:700;font-size:13.5px;padding:13px;
  display:flex;align-items:center;justify-content:center;gap:7px;
}

.checkrow{display:flex;align-items:flex-start;gap:10px;margin:2px 0 4px}
.checkrow input{width:19px;height:19px;accent-color:var(--primary);margin-top:2px;flex:none}
.checkrow span{font-size:12.5px;color:var(--text-2);line-height:1.55}

/* ===== Language chips ===== */
.langs{display:flex;justify-content:space-between;gap:10px}
.lang{
  display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);
  font-size:12.5px;font-weight:700;color:var(--text-2);
}
.lang.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ===== Welcome card ===== */
.welcome{
  border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,var(--teal),var(--primary-dark));color:#fff;
}
.welcome .t{flex:1;min-width:0}
.welcome .t small{font-size:12px;color:#D6E8E4}
.welcome .t b{display:block;font-size:20px;font-weight:800;line-height:1.3}
.welcome .t span{font-size:12px;color:#BFDCD6}
.avatar{
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.18);font-weight:800;font-size:19px;flex:none;
}

/* ===== Service grid ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;
  position:relative;
}
.tile:active{border-color:var(--primary)}
.tile .ico{
  width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--primary);
  display:grid;place-items:center;
}
.tile b{font-size:13.5px;font-weight:700;text-align:center;line-height:1.35}
.tile small{font-size:11px;color:var(--muted)}
.tile .dot{
  position:absolute;top:10px;inset-inline-end:10px;min-width:18px;height:18px;
  border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  display:grid;place-items:center;padding:0 5px;
}

/* ===== Stepper ===== */
.stepper{display:flex;align-items:flex-start;margin-bottom:18px}
.step{flex:1;display:flex;flex-direction:column;align-items:center}
.step .line{display:flex;align-items:center;width:100%}
.step .ln{flex:1;height:2px;background:var(--border)}
.step .ln.on{background:var(--primary)}
.step .n{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  font-size:12px;font-weight:700;
}
.step .n.on{background:var(--primary);border-color:var(--primary);color:#fff}
.step label{font-size:10.5px;margin-top:6px;color:var(--muted);text-align:center;line-height:1.3}
.step label.on{color:var(--primary);font-weight:700}

/* ===== Option card ===== */
.opt{
  width:100%;display:flex;align-items:center;gap:12px;text-align:start;
  background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;
}
.opt.on{background:var(--soft);border-color:var(--primary)}
.opt .ico{
  width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--primary);
  display:grid;place-items:center;flex:none;
}
.opt.on .ico{background:var(--primary);color:#fff}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:14px;font-weight:700;line-height:1.4}
.opt .t small{font-size:11.5px;color:var(--text-2)}
.radio{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none;
  display:grid;place-items:center;
}
.opt.on .radio{border-color:var(--primary)}
.opt.on .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--primary)}

/* ===== Chips ===== */
.chip{
  padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;
}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-info{background:var(--info-bg);color:var(--info)}
.c-danger{background:var(--danger-bg);color:var(--danger)}
.c-neutral{background:var(--neutral-bg);color:var(--neutral)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filt{
  flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);font-size:12.5px;font-weight:700;color:var(--text-2);
}
.filt.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ===== Request card ===== */
.req{display:flex;align-items:flex-start;gap:12px}
.req .t{flex:1;min-width:0;text-align:start}
.req .t b{display:block;font-size:14px;font-weight:700;line-height:1.4}
.req .t .ref{font-size:12px;color:var(--text-2);font-weight:600;margin-top:4px}
.req .t .dt{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ===== Calendar ===== */
.cal-head{display:flex;align-items:center;margin-bottom:6px}
.cal-head b{flex:1;text-align:center;font-size:15px;font-weight:800}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.week span{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 0}
.day{
  aspect-ratio:1;display:grid;place-items:center;border-radius:50%;
  font-size:13px;font-weight:600;
}
.day.off{color:#CBD5D7}
.day.on{background:var(--primary);color:#fff;font-weight:800}
.day.free{color:var(--primary);font-weight:800}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{
  padding:12px 4px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);font-size:12.5px;font-weight:700;text-align:center;
}
.slot.on{background:var(--primary);border-color:var(--primary);color:#fff}
.slot:disabled{background:var(--neutral-bg);color:var(--muted);text-decoration:line-through}

/* ===== Rows ===== */
.rows{border:1px solid var(--border);border-radius:18px;background:var(--surface);overflow:hidden}
.row{padding:12px 14px;border-bottom:1px solid var(--divider);text-align:start}
.row:last-child{border-bottom:none}
.row small{display:block;font-size:11.5px;color:var(--muted)}
.row div{font-size:13.5px;font-weight:700;margin-top:2px;white-space:pre-wrap}
.row.flex{display:flex;align-items:center;gap:10px}
.row.flex .g{flex:1}
.row.flex .v{font-size:13.5px;font-weight:700}

/* ===== Bottom nav ===== */
.nav{
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 max(8px,env(safe-area-inset-bottom));
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px}
.nav button.on{color:var(--primary);font-weight:700}

/* ===== Misc ===== */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .circle{
  width:76px;height:76px;border-radius:50%;background:var(--soft);color:var(--primary);
  display:grid;place-items:center;margin:0 auto 14px;font-size:30px;
}
.alert{border-radius:12px;padding:12px 14px;font-size:12.5px;margin-bottom:14px}
.a-err{background:var(--danger-bg);color:var(--danger)}
.a-ok{background:var(--ok-bg);color:var(--ok)}
.sec{font-size:15px;font-weight:800;margin:0 0 10px}
.center{text-align:center}
.mt{margin-top:14px}
.footer-cta{padding:16px;background:var(--bg);position:sticky;bottom:0}

.stars{display:flex;justify-content:center;gap:4px}
.stars button{font-size:36px;line-height:1;color:var(--border)}
.stars button.on{color:var(--star)}

/* ===== صور واقعية ===== */
.hero{
  position:relative;width:100%;max-width:340px;height:190px;border-radius:22px;
  overflow:hidden;background:linear-gradient(#EFF6F4,#D8E7E3);
  border:1px solid var(--border);
}
.hero.hero-sm{height:120px;max-width:100%}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-fade{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,66,55,.55),rgba(10,66,55,0) 55%);
}
.hero-ico{
  position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;
  gap:16px;color:#fff;
}

.opt-photo{
  width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;
  border:1px solid var(--border);background:var(--soft);
}
.opt.on .opt-photo{border-color:var(--primary)}
.ava-photo{
  width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;
  border:1px solid var(--border);
}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;
  background:var(--primary-dark);color:#fff;padding:12px 20px;border-radius:14px;
  font-size:13px;font-weight:600;max-width:90%;text-align:center;
}
</style>
</head>

/* ================= Helpers ================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function nm(o){return o?(lang==='ar'?o.ar:o.en):'';}
function initials(n){
  var p=String(n||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length)return '؟';
  return p.length===1?p[0].slice(0,1):(p[0].slice(0,1)+p[1].slice(0,1));
}
function fdate(v){
  if(!v)return '—';
  try{return new Intl.DateTimeFormat(lang==='ar'?'ar-AE-u-ca-gregory':'en-GB',
    {day:'numeric',month:'long',year:'numeric'}).format(new Date(v));}
  catch(e){return String(v).slice(0,10);}
}
function ftime(hm){
  if(!hm)return '';
  var p=String(hm).split(':'),h=+p[0],m=p[1]||'00';
  var ap=h<12?'AM':'PM',h12=h%12===0?12:h%12;
  return (h12<10?'0':'')+h12+':'+m+' '+ap;
}
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toast(m){
  var el=document.createElement('div');
  el.className='toast';el.textContent=m;document.body.appendChild(el);
  setTimeout(function(){el.remove();},2600);
}
/* صورة المهندس: تُقرأ من عمود avatar_url في قاعدة البيانات،
   وإن لم تكن موجودة تظهر الأحرف الأولى من اسمه. */
function engAvatar(e,size){
  var s=size||44;
  var fallback='<span class="avatar" style="width:'+s+'px;height:'+s+'px;'+
    'background:var(--soft);color:var(--primary);font-size:'+Math.round(s*0.34)+'px">'+
    esc(initials(e.display_name))+'</span>';
  if(!e.avatar_url) return fallback;
  return '<img class="ava-photo" style="width:'+s+'px;height:'+s+'px" '+
    'src="'+esc(e.avatar_url)+'" alt="" '+
    'onerror="this.outerHTML=this.getAttribute(\'data-fb\')" '+
    'data-fb="'+esc(fallback)+'">';
}

function chip(st,map){
  var o=map[st]||{ar:st,en:st,c:'c-neutral'};
  return '<span class="chip '+o.c+'">'+esc(lang==='ar'?o.ar:o.en)+'</span>';
}

async function loadRef(){
  var d=await db.from('departments').select('id,name_ar,name_en,region').eq('is_active',true);
  S.depts=d.data||[];
  var e=await db.from('engineers')
        .select('id,display_name,specialization,region,availability,rating,avatar_url')
        .eq('is_active',true).order('display_name');
  S.engs=e.data||[];
}
async function loadMine(){
  if(!S.user)return;
  var uid=S.user.id;
  var a=await db.from('appointments').select('*').eq('contractor_id',uid)
        .order('created_at',{ascending:false});
  S.appts=a.data||[];
  var i=await db.from('inquiries').select('*').eq('contractor_id',uid)
        .order('created_at',{ascending:false});
  S.inqs=i.data||[];
  var c=await db.from('complaints').select('*').eq('contractor_id',uid)
        .order('created_at',{ascending:false});
  S.cmps=c.data||[];
  var s=await db.from('official_app_issues').select('*').eq('reporter_id',uid)
        .order('created_at',{ascending:false});
  S.issues=s.data||[];
  var n=await db.from('notifications').select('*').eq('user_id',uid)
        .order('created_at',{ascending:false}).limit(50);
  S.notifs=n.data||[];
}
function unread(){return S.notifs.filter(function(n){return !n.is_read;}).length;}

/* ================= Auth ================= */
async function doLogin(){
  S.busy=true;S.msg=null;render();
  var r=await db.auth.signInWithPassword({
    email:($('f_email').value||'').trim(),password:$('f_pass').value||''});
  if(r.error){S.busy=false;S.msg={t:'err',m:t('badLogin')};render();return;}
  await boot();
}
async function doStaffSignup(){
  var em=($('f_email').value||'').trim();
  var p1=$('f_pass').value||'', p2=$('f_pass2').value||'';
  if(!em){S.msg={t:'err',m:t('required')};render();return;}
  if(p1.length<8){S.msg={t:'err',m:t('passShort')};render();return;}
  if(p1!==p2){S.msg={t:'err',m:t('passMismatch')};render();return;}

  S.busy=true;S.msg=null;render();
  var r=await db.auth.signUp({email:em,password:p1,
    options:{data:{account_type:'staff',phone:($('f_tel').value||'').trim()}}});
  S.busy=false;
  if(r.error){
    var m=String(r.error.message||'');
    if(m.indexOf('staff_email_not_authorized')!==-1) m=t('staffNotAuth');
    S.msg={t:'err',m:m};render();return;
  }
  toast(t('staffDone'));go('login');
}

async function doSignup(){
  if(!$('f_agree').checked){S.msg={t:'err',m:t('agree')};render();return;}
  S.busy=true;S.msg=null;render();
  var r=await db.auth.signUp({
    email:($('f_email').value||'').trim(),password:$('f_pass').value||'',
    options:{data:{full_name:($('f_name').value||'').trim(),
      company_name:($('f_co').value||'').trim(),phone:($('f_tel').value||'').trim()}}});
  S.busy=false;
  if(r.error){
    var em=String(r.error.message||'');
    if(em.indexOf('staff_email_use_staff_activation')!==-1) em=t('staffUseStaff');
    S.msg={t:'err',m:em};render();return;
  }
  toast(t('accCreated'));go('login');
}
async function doForgot(){
  S.busy=true;render();
  await db.auth.resetPasswordForEmail(($('f_email').value||'').trim(),
    {redirectTo:location.origin+location.pathname});
  S.busy=false;toast(t('linkSent'));go('login');
}
async function logout(){await db.auth.signOut();S.user=null;S.profile=null;go('login');}

async function boot(){
  var u=await db.auth.getUser();
  if(!u.data||!u.data.user){S.busy=false;go('login');return;}
  S.user=u.data.user;
  var p=await db.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=p.data||null;
  // الموظفون (مهندس/مسؤول/أدمن) لا يستخدمون تطبيق المقاول
  if(S.profile && S.profile.role && S.profile.role!=='contractor'){
    S.busy=false;go('staffPortal');return;
  }

  await loadRef();
  await loadMine();
  S.busy=false;S.tab='home';go('home');
}

function stepper(i){
  var labels=[t('stService'),t('stEng'),t('stTime'),t('stDone')],h='';
  for(var k=0;k<4;k++){
    h+='<div class="step"><div class="line">'+
      (k===0?'<span class="ln" style="visibility:hidden"></span>'
            :'<span class="ln'+(k<=i?' on':'')+'"></span>')+
      '<span class="n'+(k<=i?' on':'')+'">'+(k+1)+'</span>'+
      (k===3?'<span class="ln" style="visibility:hidden"></span>'
            :'<span class="ln'+(k<i?' on':'')+'"></span>')+
      '</div><label class="'+(k<=i?'on':'')+'">'+esc(labels[k])+'</label></div>';
  }
  return '<div class="stepper">'+h+'</div>';
}

function allRequests(){
  var out=[];
  S.appts.forEach(function(a){out.push({k:'appt',id:a.id,title:a.service,
    ref:a.permit_reference||('#'+a.id.slice(0,8).toUpperCase()),
    date:a.appointment_date,st:a.status,map:APPT,row:a});});
  S.inqs.forEach(function(a){out.push({k:'inq',id:a.id,title:a.topic||t('inq'),
    ref:a.permit_reference||('#'+a.id.slice(0,8).toUpperCase()),
    date:a.created_at,st:a.status,map:TICKET,row:a});});
  S.cmps.forEach(function(a){out.push({k:'cmp',id:a.id,title:a.category||t('cmp'),
    ref:a.permit_reference||('#'+a.id.slice(0,8).toUpperCase()),
    date:a.created_at,st:a.status,map:TICKET,row:a});});
  S.issues.forEach(function(a){out.push({k:'iss',id:a.id,title:a.issue_type,
    ref:a.permit_reference||('#'+a.id.slice(0,8).toUpperCase()),
    date:a.created_at,st:a.status,map:TICKET,row:a});});
  out.sort(function(x,y){return new Date(y.date)-new Date(x.date);});
  return out;
}

/* ================= Nav ================= */
var NAVS=[['home','home','home'],['requests','list','myReq'],
          ['inquiries','chat','inq'],['profile','user','profile']];
function renderNav(){
  var show=['home','requests','inquiries','profile'].indexOf(S.view)!==-1;
  var nav=$('nav');
  if(!show){nav.classList.add('hide');return;}
  nav.classList.remove('hide');
  nav.innerHTML=NAVS.map(function(n){
    return '<button class="'+(S.view===n[0]?'on':'')+'" data-go="'+n[0]+'">'+
      svg(n[1],21)+'<span>'+esc(t(n[2]))+'</span></button>';
  }).join('');
}

/* ================= Render ================= */
var VIEWS={splash:vSplash,login:vLogin,forgot:vForgot,signup:vSignup,
 staff:vStaff,staffPortal:vStaffPortal,home:vHome,
 book1:vBook1,book2:vBook2,book3:vBook3,book4:vBook4,requests:vRequests,
 inquiries:function(){return listView('inq');},complaints:function(){return listView('cmp');},
 issues:function(){return listView('iss');},newInq:vNewInq,newCmp:vNewCmp,newIssue:vNewIssue,
 detail:vDetail,notifs:vNotifs,profile:vProfile,company:vCompany,contact:vContact,
 rate:vRate,permits:vPermits};

function render(){
  var f=VIEWS[S.view]||vLogin;
  $('view').innerHTML=f();
  renderNav();
}

/* ================= Slot loading ================= */
async function loadSlots(){
  var d=S.draft;
  S.booked=[];
  if(!d.date||!d.engId){render();return;}
  var r=await db.from('appointments').select('appointment_time')
    .eq('engineer_id',d.engId).eq('appointment_date',d.date).neq('status','cancelled');
  S.booked=(r.data||[]).map(function(x){return String(x.appointment_time).slice(0,5);});
  render();
}

/* ================= Events ================= */
document.addEventListener('click',function(ev){
  var el;

  el=ev.target.closest('[data-lang]');
  if(el){setLang(el.getAttribute('data-lang'));return;}

  el=ev.target.closest('[data-eye]');
  if(el){var f=$(el.getAttribute('data-eye'));
    f.type=f.type==='password'?'text':'password';return;}

  el=ev.target.closest('[data-go]');
  if(el){
    var v=el.getAttribute('data-go');
    if(v==='book1'){S.draft={};}
    go(v);return;
  }

  el=ev.target.closest('[data-svc]');
  if(el){
    var id=el.getAttribute('data-svc');
    S.draft.serviceId=id;
    for(var i=0;i<BOOK_SERVICES.length;i++)
      if(BOOK_SERVICES[i].id===id) S.draft.serviceName=BOOK_SERVICES[i].ar;
    render();return;
  }

  el=ev.target.closest('[data-dept]');
  if(el){
    var did=el.getAttribute('data-dept');
    S.draft.deptId=did;
    for(var j=0;j<S.depts.length;j++)
      if(S.depts[j].id===did) S.draft.regionName=S.depts[j].name_ar;
    S.draft.engId=null;render();return;
  }

  el=ev.target.closest('[data-eng]');
  if(el){S.draft.engId=el.getAttribute('data-eng');render();return;}

  el=ev.target.closest('[data-mon]');
  if(el){
    var base=S.draft.month?new Date(S.draft.month):new Date();
    base.setDate(1);
    base.setMonth(base.getMonth()+(+el.getAttribute('data-mon')));
    S.draft.month=base.toISOString();render();return;
  }

  el=ev.target.closest('[data-day]');
  if(el){S.draft.date=el.getAttribute('data-day');S.draft.time=null;loadSlots();return;}

  el=ev.target.closest('[data-slot]');
  if(el){S.draft.time=el.getAttribute('data-slot');render();return;}

  el=ev.target.closest('[data-filter]');
  if(el){S.filter=el.getAttribute('data-filter');render();return;}

  el=ev.target.closest('[data-star]');
  if(el){S.rating=+el.getAttribute('data-star');render();return;}

  el=ev.target.closest('[data-det]');
  if(el){
    var parts=el.getAttribute('data-det').split(':');
    var list=allRequests();
    for(var k=0;k<list.length;k++)
      if(list[k].k===parts[0]&&list[k].id===parts[1]) S.detail=list[k];
    go('detail');return;
  }

  el=ev.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act');

  if(a==='login')       return doLogin();
  if(a==='signup')      return doSignup();
  if(a==='staffSignup') return doStaffSignup();
  if(a==='forgot')     return doForgot();
  if(a==='logout')     return logout();
  if(a==='sendInq')    return submitInquiry();
  if(a==='sendCmp')    return submitComplaint();
  if(a==='sendIssue')  return submitIssue();
  if(a==='sendRate')   return submitRating();
  if(a==='bconfirm'){
    S.draft.permit=($('f_permit')||{}).value||'';
    S.draft.notes=($('f_notes')||{}).value||'';
    return submitBooking();
  }
  if(a==='allreg'){S.draft.allRegions=!S.draft.allRegions;render();return;}
  if(a==='b1next'){
    if(!S.draft.serviceId||!S.draft.deptId){toast(t('required'));return;}
    go('book2');return;
  }
  if(a==='b2next'){
    if(!S.draft.engId){toast(t('required'));return;}
    go('book3');return;
  }
  if(a==='b3next'){
    if(!S.draft.date||!S.draft.time){toast(t('required'));return;}
    go('book4');return;
  }
  if(a==='markall'){
    var ids=S.notifs.filter(function(n){return !n.is_read;}).map(function(n){return n.id;});
    if(ids.length){
      db.from('notifications').update({is_read:true}).in('id',ids);
      S.notifs.forEach(function(n){n.is_read=true;});
    }
    render();return;
  }
});

document.addEventListener('input',function(ev){
  if(ev.target.id==='f_q'){S.draft.q=ev.target.value;}
});

/* ================= Start ================= */
render();
db.auth.getSession().then(function(s){
  if(s.data&&s.data.session) boot();
  else setTimeout(function(){go('login');},2800);
});
})();
